<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="melodiumGold" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ece75f" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ece75f" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="91" stroke="url(#ringGold)" stroke-width="6.5" fill="none" />
  <circle cx="100" cy="100" r="78" fill="url(#melodiumGold)" filter="url(#goldGlow)" />
  <g filter="url(#iconShadow)">
    <path d="M 45 92 A 58 58 0 0 1 93 44" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 58 95 A 42 42 0 0 1 95 58" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>
  <g filter="url(#iconShadow)">
    <rect x="131" y="58" width="22" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <path d="M 153 65 L 191 65" stroke="#ffffff" stroke-width="6" stroke-linecap="square" />
  </g>
  <g filter="url(#iconShadow)">
    <rect x="83" y="68" width="38" height="64" rx="19" fill="none" stroke="#ffffff" stroke-width="7" />
    <path d="M 72 104 L 72 114 A 30 30 0 0 0 132 114 L 132 104" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 102 144 L 102 163" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
