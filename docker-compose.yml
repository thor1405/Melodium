version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_51MelodiumSjecTestKey2026JamRoomPassPubKey999}
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: melodium-sjec-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/melodium_sjec}
      - JWT_SECRET=${JWT_SECRET:-melodium_sjec_super_secret_jwt_key_2026_music_rocks}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-Melodium SJEC <no-reply@melodium-sjec.edu>}
      - TIMEZONE=${TIMEZONE:-Asia/Kolkata}
    volumes:
      - server_uploads:/app/server/uploads
    # Uncomment the following depends_on if using the local mongo service below
    # depends_on:
    #   - mongo

  # Optional local MongoDB service (if not using MongoDB Atlas)
  mongo:
    image: mongo:7.0
    container_name: melodium-sjec-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local
  server_uploads:
    driver: local
